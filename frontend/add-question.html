
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUIZZ PURGE - Ajouter une question</title>
    <style>
        :root {
            --neon-red: #ff3e3e;
            --dark-purple: #8c3aff;
            --black-bg: #1a1a2e;
            --light-text: #f1f1f1;
            --container-bg: rgba(30, 30, 60, 0.7);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--black-bg);
            color: var(--light-text);
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(140, 58, 255, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(255, 62, 62, 0.1) 0%, transparent 20%);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            display: flex;
            align-items: center;
        }

        .logo h1 {
            font-size: 1.8rem;
            font-weight: bold;
            background: linear-gradient(90deg, #fff, var(--neon-red));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 10px rgba(255, 62, 62, 0.3);
        }

        .logo span {
            color: var(--neon-red);
            text-shadow: 0 0 10px var(--neon-red);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .user-info img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid var(--neon-red);
        }

        .user-info span {
            font-weight: bold;
        }

        .logout-btn {
            background: transparent;
            border: 1px solid var(--neon-red);
            color: var(--neon-red);
            padding: 0.5rem 1rem;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: var(--neon-red);
            color: white;
            box-shadow: 0 0 15px var(--neon-red);
        }

        main {
            padding: 2rem;
            max-width: 800px;
            margin: 0 auto;
        }

        .page-title {
            text-align: center;
            margin-bottom: 2rem;
            font-size: 2rem;
            font-weight: 300;
            color: var(--light-text);
        }

        .form-container {
            background: var(--container-bg);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--light-text);
        }

        input, textarea {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.3);
            color: var(--light-text);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--neon-red);
            box-shadow: 0 0 10px rgba(255, 62, 62, 0.5);
        }

        .option-container {
            display: flex;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .option-container input[type="radio"] {
            width: auto;
            margin-right: 1rem;
        }

        .option-container input[type="text"] {
            flex-grow: 1;
        }

        .btn {
            display: inline-block;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(45deg, var(--dark-purple), var(--neon-red));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(140, 58, 255, 0.3);
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid var(--neon-red);
            color: var(--neon-red);
            margin-right: 1rem;
        }

        .btn-secondary:hover {
            background: var(--neon-red);
            color: white;
            box-shadow: 0 0 15px var(--neon-red);
        }

        .action-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 2rem;
        }

        .error-message {
            color: var(--neon-red);
            margin-top: 0.5rem;
            font-size: 0.9rem;
            display: none;
        }

        .success-message {
            color: #4CAF50;
            margin-top: 0.5rem;
            font-size: 0.9rem;
            display: none;
        }

        @media (max-width: 768px) {
            .form-container {
                padding: 1.5rem;
            }

            .action-buttons {
                flex-direction: column;
                gap: 1rem;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <h1>QUIZZ <span>PURGE</span></h1>
        </div>
        <div class="user-info">
            <span id="usernameDisplay">Admin</span>
            <button class="logout-btn" id="logoutBtn">Déconnexion</button>
        </div>
    </header>

    <main>
        <h1 class="page-title">Ajouter une question</h1>
        
        <div class="form-container">
            <form id="questionForm">
                <div class="form-group">
                    <label for="question">Question</label>
                    <textarea id="question" name="question" required></textarea>
                </div>

                <div class="form-group">
                    <label>Options (cochez la bonne réponse)</label>
                    
                    <div class="option-container">
                        <input type="radio" name="correctAnswer" value="0" required>
                        <input type="text" id="option1" name="options[]" placeholder="Option 1" required>
                    </div>
                    
                    <div class="option-container">
                        <input type="radio" name="correctAnswer" value="1">
                        <input type="text" id="option2" name="options[]" placeholder="Option 2" required>
                    </div>
                    
                    <div class="option-container">
                        <input type="radio" name="correctAnswer" value="2">
                        <input type="text" id="option3" name="options[]" placeholder="Option 3" required>
                    </div>
                    
                    <div class="option-container">
                        <input type="radio" name="correctAnswer" value="3">
                        <input type="text" id="option4" name="options[]" placeholder="Option 4" required>
                    </div>
                </div>

                <div class="error-message" id="formError"></div>
                <div class="success-message" id="formSuccess"></div>

                <div class="action-buttons">
                    <div>
                        <button type="button" class="btn btn-secondary" id="cancelBtn">Annuler</button>
                        <button type="submit" class="btn btn-primary">Ajouter la question</button>
                    </div>
                    <button type="button" class="btn btn-primary" id="addAnotherBtn" style="display: none;">Ajouter une autre</button>
                </div>
            </form>
        </div>
    </main>

    <script src="add-question.js"></script>
</body>
</html>
