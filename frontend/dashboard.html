<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUIZZ PURGE - Tableau de bord</title>
    <style>
        :root {
            --neon-red: #ff3e3e;
            --dark-purple: #8c3aff;
            --black-bg: #1a1a2e;
            --light-text: #f1f1f1;
            --container-bg: rgba(30, 30, 60, 0.7);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--black-bg);
            color: var(--light-text);
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(140, 58, 255, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(255, 62, 62, 0.1) 0%, transparent 20%);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            display: flex;
            align-items: center;
        }

        .logo h1 {
            font-size: 1.8rem;
            font-weight: bold;
            background: linear-gradient(90deg, #fff, var(--neon-red));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 10px rgba(255, 62, 62, 0.3);
        }

        .logo span {
            color: var(--neon-red);
            text-shadow: 0 0 10px var(--neon-red);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .user-info img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid var(--neon-red);
        }

        .user-info span {
            font-weight: bold;
        }

        .logout-btn {
            background: transparent;
            border: 1px solid var(--neon-red);
            color: var(--neon-red);
            padding: 0.5rem 1rem;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: var(--neon-red);
            color: white;
            box-shadow: 0 0 15px var(--neon-red);
        }

        main {
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .dashboard-title {
            text-align: center;
            margin-bottom: 2rem;
            font-size: 2rem;
            font-weight: 300;
            color: var(--light-text);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .dashboard-card {
            background: var(--container-bg);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dashboard-card h2 {
            font-size: 1.3rem;
            margin-bottom: 1rem;
            color: var(--neon-red);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 0.5rem;
        }

        .stats-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.8rem;
        }

        .stats-item:last-child {
            margin-bottom: 0;
        }

        .stats-label {
            color: rgba(255, 255, 255, 0.7);
        }

        .stats-value {
            font-weight: bold;
        }

        .history-item {
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .history-item:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        .history-date {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .history-score {
            font-weight: bold;
            color: var(--neon-red);
        }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding: 0.5rem;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        .leaderboard-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .leaderboard-position {
            font-weight: bold;
            color: var(--neon-red);
            width: 30px;
        }

        .leaderboard-user {
            flex-grow: 1;
            margin: 0 1rem;
        }

        .leaderboard-score {
            font-weight: bold;
        }

        .you {
            background: rgba(140, 58, 255, 0.1);
            border-left: 3px solid var(--neon-red);
        }

        .notification-item {
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .notification-item:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        .notification-date {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .notification-content {
            margin-top: 0.3rem;
        }

        .admin {
            color: var(--neon-red);
        }

        .btn {
            display: inline-block;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            text-align: center;
            margin-top: 1rem;
        }

        .btn-primary {
            background: linear-gradient(45deg, var(--dark-purple), var(--neon-red));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(140, 58, 255, 0.3);
        }

        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <h1>QUIZZ <span>PURGE</span></h1>
        </div>
        <div class="user-info">
            <span id="usernameDisplay">Invité</span>
            <button class="logout-btn" id="logoutBtn">Déconnexion</button>
        </div>
    </header>

    <main>
        <h1 class="dashboard-title">Tableau de bord</h1>
        
        <div class="dashboard-grid">
            <div class="dashboard-card">
                <h2>Vos statistiques</h2>
                <div class="stats-item">
                    <span class="stats-label">Score total</span>
                    <span class="stats-value" id="totalScore">0</span>
                </div>
                <div class="stats-item">
                    <span class="stats-label">Parties jouées</span>
                    <span class="stats-value" id="totalGames">0</span>
                </div>
                <div class="stats-item">
                    <span class="stats-label">Moyenne</span>
                    <span class="stats-value" id="averageScore">0</span>
                </div>
                <div class="stats-item">
                    <span class="stats-label">Rang</span>
                    <span class="stats-value" id="userRank">-</span>
                </div>
                <a href="quiz.html" class="btn btn-primary">Nouvelle partie</a>
            </div>

            <div class="dashboard-card">
                <h2>Historique des parties</h2>
                <div id="historyList">
                    <!-- L'historique sera ajouté ici par JavaScript -->
                </div>
            </div>

            <div class="dashboard-card">
                <h2>Classement</h2>
                <div id="leaderboardList">
                    <!-- Le classement sera ajouté ici par JavaScript -->
                </div>
            </div>

            <div class="dashboard-card">
                <h2>Notifications</h2>
                <div id="notificationsList">
                    <!-- Les notifications seront ajoutées ici par JavaScript -->
                </div>
            </div>
        </div>
    </main>

    <script src="user.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
