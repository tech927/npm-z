
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purge Quizz - Accueil</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #1a1a2e;
            color: #e6e6e6;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-image: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('https://images.unsplash.com/photo-1511512578047-dfb367046420?ixlib=rb-1.2.1&auto=format&fit=crop&w=1351&q=80');
            background-size: cover;
            background-position: center;
        }
        .container {
            width: 90%;
            max-width: 500px;
            background-color: rgba(26, 26, 46, 0.9);
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        h1 {
            color: #f05454;
            margin-bottom: 1.5rem;
            font-size: 2.5rem;
        }
        p {
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            background-color: #f05454;
            color: white;
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            margin: 0.5rem;
            transition: all 0.3s ease;
            cursor: pointer;
            width: 80%;
        }
        .btn:hover {
            background-color: #d93b3b;
            transform: translateY(-3px);
        }
        .btn-secondary {
            background-color: #30475e;
        }
        .btn-secondary:hover {
            background-color: #222f3e;
        }
        .logo {
            width: 100px;
            margin-bottom: 1rem;
        }
        footer {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #666;
        }
        @media (max-width: 600px) {
            .container {
                width: 95%;
                padding: 1.5rem;
            }
            h1 {
                font-size: 2rem;
            }
            .btn {
                width: 100%;
                margin: 0.5rem 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Purge Quizz</h1>
        <p>Testez vos connaissances sur la Purge Virtuelle et défiez vos amis !</p>
        
        <a href="/register.html" class="btn">S'inscrire</a>
        <a href="/login.html" class="btn btn-secondary">Se connecter</a>
        
        <footer>by inconnu boy © 2023</footer>
    </div>
</body>
</html>
