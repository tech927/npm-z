<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUIZZ PURGE - Accueil</title>
    <style>
        :root {
            --neon-red: #ff3e3e;
            --dark-purple: #8c3aff;
            --black-bg: #1a1a2e;
            --light-text: #f1f1f1;
            --container-bg: rgba(30, 30, 60, 0.7);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--black-bg);
            color: var(--light-text);
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(140, 58, 255, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(255, 62, 62, 0.1) 0%, transparent 20%);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            display: flex;
            align-items: center;
        }

        .logo h1 {
            font-size: 1.8rem;
            font-weight: bold;
            background: linear-gradient(90deg, #fff, var(--neon-red));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 10px rgba(255, 62, 62, 0.3);
        }

        .logo span {
            color: var(--neon-red);
            text-shadow: 0 0 10px var(--neon-red);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .user-info img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid var(--neon-red);
        }

        .user-info span {
            font-weight: bold;
        }

        .logout-btn {
            background: transparent;
            border: 1px solid var(--neon-red);
            color: var(--neon-red);
            padding: 0.5rem 1rem;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: var(--neon-red);
            color: white;
            box-shadow: 0 0 15px var(--neon-red);
        }

        main {
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .welcome-section {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .welcome-section h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            font-weight: 300;
        }

        .welcome-section p {
            color: rgba(255, 255, 255, 0.7);
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 2rem;
        }

        .btn {
            padding: 1rem 2rem;
            border-radius: 8px;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(45deg, var(--dark-purple), var(--neon-red));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(140, 58, 255, 0.3);
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid var(--neon-red);
            color: var(--neon-red);
        }

        .btn-secondary:hover {
            background: var(--neon-red);
            color: white;
            box-shadow: 0 0 15px var(--neon-red);
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            margin-top: 3rem;
        }

        .stat-card {
            background: var(--container-bg);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 1.5rem;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            animation: fadeIn 1s ease-in-out;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            border-color: var(--neon-red);
        }

        .stat-card h3 {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            color: var(--neon-red);
        }

        .stat-card p {
            font-size: 2rem;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }

            .actions {
                flex-direction: column;
                gap: 1rem;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <h1>QUIZZ <span>PURGE</span></h1>
        </div>
        <div class="user-info">
            <span id="usernameDisplay">Invité</span>
            <button class="logout-btn" id="logoutBtn">Déconnexion</button>
        </div>
    </header>

    <main>
        <section class="welcome-section">
            <h2>Bienvenue sur QUIZZ PURGE</h2>
            <p>Testez vos connaissances avec notre quiz futuriste et affrontez d'autres joueurs dans une compétition épique pour la première place !</p>
            
            <div class="actions">
                <a href="quiz.html" class="btn btn-primary">Commencer le quiz</a>
                <a href="dashboard.html" class="btn btn-secondary">Tableau de bord</a>
            </div>
        </section>

        <div class="stats-container">
            <div class="stat-card">
                <h3>Votre score</h3>
                <p id="userScore">0</p>
            </div>
            <div class="stat-card">
                <h3>Votre rang</h3>
                <p id="userRank">-</p>
            </div>
            <div class="stat-card">
                <h3>Parties jouées</h3>
                <p id="gamesPlayed">0</p>
            </div>
        </div>
    </main>

    <script src="user.js"></script>
</body>
</html>
