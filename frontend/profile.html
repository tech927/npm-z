
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUIZZ PURGE - Profil</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        
        :root {
            --neon-red: #ff3e3e;
            --neon-pink: #e94560;
            --dark-bg: #1a1a2e;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --text-light: #ffffff;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Orbitron', sans-serif;
        }
        
        body {
            background: linear-gradient(-45deg, #1a1a2e, #16213e, #0f3460);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            color: var(--text-light);
            min-height: 100vh;
        }
        
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 0;
            opacity: 0;
            animation: fadeIn 0.5s ease-in forwards;
        }
        
        @keyframes fadeIn {
            to { opacity: 1; }
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 2rem;
        }
        
        .logo {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(to right, var(--neon-red), var(--neon-pink));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .user-menu {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .btn {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            background: var(--glass-bg);
            color: var(--text-light);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(233, 69, 96, 0.4);
        }
        
        .btn-primary {
            background: linear-gradient(45deg, var(--neon-red), var(--neon-pink));
        }
        
        .profile-header {
            display: flex;
            align-items: center;
            gap: 2rem;
            margin-bottom: 3rem;
        }
        
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--neon-red), var(--neon-pink));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: bold;
        }
        
        .user-info h2 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, var(--neon-red), var(--neon-pink));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .user-info p {
            opacity: 0.8;
            margin-bottom: 1rem;
        }
        
        .profile-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }
        
        .profile-card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .card-title {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: var(--neon-pink);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 0.5rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            opacity: 0.8;
        }
        
        input {
            width: 100%;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: var(--text-light);
            font-size: 1rem;
        }
        
        input:disabled {
            opacity: 0.6;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }
        
        .stat-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--neon-pink);
            margin-bottom: 0.3rem;
        }
        
        .stat-label {
            font-size: 0.8rem;
            opacity: 0.7;
        }
        
        @media (max-width: 768px) {
            .profile-grid {
                grid-template-columns: 1fr;
            }
            
            .profile-header {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">QUIZZ PURGE</div>
            <div class="user-menu">
                <button class="btn" onclick="goToPage('/dashboard')">Tableau de bord</button>
                <button class="btn btn-primary" onclick="logout()">Déconnexion</button>
            </div>
        </header>
        
        <main>
            <div class="profile-header">
                <div class="avatar" id="userAvatar">U</div>
                <div class="user-info">
                    <h2 id="username">Utilisateur</h2>
                    <p>Membre depuis: <span id="joinDate">Janvier 2023</span></p>
                    <button class="btn" onclick="toggleEdit()">Modifier le profil</button>
                </div>
            </div>
            
            <div class="profile-grid">
                <div class="profile-card">
                    <h3 class="card-title">Informations personnelles</h3>
                    <form id="profileForm">
                        <div class="form-group">
                            <label>Nom d'utilisateur</label>
                            <input type="text" id="inputUsername" disabled>
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="inputEmail" disabled>
                        </div>
                        <div class="form-group">
                            <label>Nouveau mot de passe</label>
                            <input type="password" id="inputPassword" placeholder="Laisser vide pour ne pas changer" disabled>
                        </div>
                        <button type="submit" class="btn btn-primary" id="saveBtn" style="display: none;">Enregistrer</button>
                    </form>
                </div>
                
                <div class="profile-card">
                    <h3 class="card-title">Statistiques</h3>
                    <div class="stats-grid">
                        <div class="stat-item">
                            <div class="stat-value">24</div>
                            <div class="stat-label">Parties jouées</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">1,240</div>
                            <div class="stat-label">Meilleur score</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">82%</div>
                            <div class="stat-label">Réussite</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">#15</div>
                            <div class="stat-label">Classement</div>
                        </div>
                    </div>
                    
                    <h3 style="margin-top: 2rem; margin-bottom: 1rem;">Dernières parties</h3>
                    <div style="opacity: 0.7; font-size: 0.9rem;">
                        <p>12/08 - Score: 850</p>
                        <p>10/08 - Score: 720</p>
                        <p>08/08 - Score: 920</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Vérification de l'authentification
            const token = localStorage.getItem('token');
            const username = localStorage.getItem('username');
            
            if (!token) {
                goToPage('/login');
                return;
            }
            
            // Afficher les informations utilisateur
            if (username) {
                document.getElementById('username').textContent = username;
                document.getElementById('inputUsername').value = username;
                document.getElementById('userAvatar').textContent = username.charAt(0).toUpperCase();
            }
            
            // Simulation de données utilisateur
            document.getElementById('inputEmail').value = 'utilisateur@example.com';
        });

        function toggleEdit() {
            const inputs = document.querySelectorAll('#profileForm input');
            const saveBtn = document.getElementById('saveBtn');
            
            inputs.forEach(input => {
                input.disabled = !input.disabled;
            });
            
            saveBtn.style.display = saveBtn.style.display === 'none' ? 'block' : 'none';
        }

        document.getElementById('profileForm').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('Modifications enregistrées !');
            toggleEdit();
        });

        function goToPage(url) {
            document.querySelector('.container').style.animation = 'fadeOut 0.5s ease-out forwards';
            setTimeout(() => {
                window.location.href = url;
            }, 500);
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('username');
            goToPage('/');
        }

        // Ajout de l'animation fadeOut
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes fadeOut {
                to { opacity: 0; transform: translateY(20px); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
