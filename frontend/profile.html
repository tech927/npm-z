<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUIZZ PURGE - Profil</title>
    <style>
        :root {
            --neon-red: #ff3e3e;
            --dark-purple: #8c3aff;
            --black-bg: #1a1a2e;
            --light-text: #f1f1f1;
            --container-bg: rgba(30, 30, 60, 0.7);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--black-bg);
            color: var(--light-text);
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(140, 58, 255, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(255, 62, 62, 0.1) 0%, transparent 20%);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            display: flex;
            align-items: center;
        }

        .logo h1 {
            font-size: 1.8rem;
            font-weight: bold;
            background: linear-gradient(90deg, #fff, var(--neon-red));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 10px rgba(255, 62, 62, 0.3);
        }

        .logo span {
            color: var(--neon-red);
            text-shadow: 0 0 10px var(--neon-red);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .user-info img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid var(--neon-red);
        }

        .user-info span {
            font-weight: bold;
        }

        .logout-btn {
            background: transparent;
            border: 1px solid var(--neon-red);
            color: var(--neon-red);
            padding: 0.5rem 1rem;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: var(--neon-red);
            color: white;
            box-shadow: 0 0 15px var(--neon-red);
        }

        main {
            padding: 2rem;
            max-width: 800px;
            margin: 0 auto;
        }

        .profile-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .profile-header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            font-weight: 300;
        }

        .profile-header p {
            color: rgba(255, 255, 255, 0.7);
        }

        .avatar-container {
            width: 120px;
            height: 120px;
            margin: 0 auto 1rem;
            position: relative;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid var(--neon-red);
            object-fit: cover;
        }

        .profile-card {
            background: var(--container-bg);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 2rem;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--light-text);
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.3);
            color: var(--light-text);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--neon-red);
            box-shadow: 0 0 10px rgba(255, 62, 62, 0.5);
        }

        .btn {
            display: inline-block;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(45deg, var(--dark-purple), var(--neon-red));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(140, 58, 255, 0.3);
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid var(--neon-red);
            color: var(--neon-red);
        }

        .btn-secondary:hover {
            background: var(--neon-red);
            color: white;
            box-shadow: 0 0 15px var(--neon-red);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
        }

        .stat-item {
            text-align: center;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--neon-red);
        }

        .stat-label {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .error-message {
            color: var(--neon-red);
            margin-top: 0.5rem;
            font-size: 0.9rem;
            display: none;
        }

        .success-message {
            color: #4CAF50;
            margin-top: 0.5rem;
            font-size: 0.9rem;
            display: none;
        }

        @media (max-width: 768px) {
            .profile-card {
                padding: 1.5rem;
            }

            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <h1>QUIZZ <span>PURGE</span></h1>
        </div>
        <div class="user-info">
            <button class="logout-btn" id="logoutBtn">Déconnexion</button>
        </div>
    </header>

    <main>
        <div class="profile-header">
            <div class="avatar-container">
                <img src="https://via.placeholder.com/120" alt="Avatar" class="avatar" id="userAvatar">
            </div>
            <h1 id="profileUsername">Nom d'utilisateur</h1>
            <p>Membre depuis <span id="memberSince">-</span></p>
        </div>

        <div class="profile-card">
            <h2>Informations du profil</h2>
            <form id="profileForm">
                <div class="form-group">
                    <label for="username">Nom d'utilisateur</label>
                    <input type="text" id="username" name="username" required>
                    <div class="error-message" id="usernameError"></div>
                    <div class="success-message" id="usernameSuccess"></div>
                </div>
                <button type="submit" class="btn btn-primary">Mettre à jour</button>
            </form>
        </div>

        <div class="profile-card">
            <h2>Statistiques</h2>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-value" id="totalPoints">0</div>
                    <div class="stat-label">Points</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="gamesPlayed">0</div>
                    <div class="stat-label">Parties</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="averageScore">0</div>
                    <div class="stat-label">Moyenne</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="userRank">-</div>
                    <div class="stat-label">Rang</div>
                </div>
            </div>
        </div>

        <div class="profile-card">
            <h2>Actions</h2>
            <button class="btn btn-primary" id="changeAvatarBtn">Changer d'avatar</button>
            <button class="btn btn-secondary" id="deleteAccountBtn">Supprimer le compte</button>
        </div>
    </main>

    <script src="user.js"></script>
    <script src="profile.js"></script>
</body>
</html>
