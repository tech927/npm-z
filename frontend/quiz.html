<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUIZZ PURGE - Quiz</title>
    <style>
        :root {
            --neon-red: #ff3e3e;
            --dark-purple: #8c3aff;
            --black-bg: #1a1a2e;
            --light-text: #f1f1f1;
            --container-bg: rgba(30, 30, 60, 0.7);
            --correct: #4CAF50;
            --incorrect: #F44336;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--black-bg);
            color: var(--light-text);
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(140, 58, 255, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(255, 62, 62, 0.1) 0%, transparent 20%);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            display: flex;
            align-items: center;
        }

        .logo h1 {
            font-size: 1.8rem;
            font-weight: bold;
            background: linear-gradient(90deg, #fff, var(--neon-red));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 10px rgba(255, 62, 62, 0.3);
        }

        .logo span {
            color: var(--neon-red);
            text-shadow: 0 0 10px var(--neon-red);
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .progress-container {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin: 1rem 0;
            height: 10px;
        }

        .progress-bar {
            height: 100%;
            border-radius: 10px;
            background: linear-gradient(90deg, var(--dark-purple), var(--neon-red));
            transition: width 0.3s ease;
        }

        .quiz-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
            background: var(--container-bg);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .question-container {
            margin-bottom: 2rem;
        }

        .question {
            font-size: 1.3rem;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        .options-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }

        .option {
            padding: 1rem;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .option:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--neon-red);
            transform: translateX(5px);
        }

        .option.selected {
            background: rgba(140, 58, 255, 0.2);
            border-color: var(--dark-purple);
        }

        .option.correct {
            background: rgba(76, 175, 80, 0.2);
            border-color: var(--correct);
        }

        .option.incorrect {
            background: rgba(244, 67, 54, 0.2);
            border-color: var(--incorrect);
        }

        .next-btn {
            display: block;
            margin: 2rem auto 0;
            padding: 0.8rem 2rem;
            border-radius: 8px;
            border: none;
            background: linear-gradient(45deg, var(--dark-purple), var(--neon-red));
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .next-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(140, 58, 255, 0.3);
        }

        .next-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .result-container {
            text-align: center;
            display: none;
        }

        .result-container h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .result-container p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 2rem;
        }

        .btn {
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(45deg, var(--dark-purple), var(--neon-red));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(140, 58, 255, 0.3);
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid var(--neon-red);
            color: var(--neon-red);
        }

        .btn-secondary:hover {
            background: var(--neon-red);
            color: white;
            box-shadow: 0 0 15px var(--neon-red);
        }

        @media (max-width: 768px) {
            .quiz-container {
                padding: 1.5rem;
                margin: 1rem;
            }

            .question {
                font-size: 1.1rem;
            }

            .action-buttons {
                flex-direction: column;
                gap: 1rem;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <h1>QUIZZ <span>PURGE</span></h1>
        </div>
        <div class="quiz-header">
            <span id="question-count">Question 1/10</span>
            <span id="score">Score: 0</span>
        </div>
    </header>

    <div class="progress-container">
        <div class="progress-bar" id="progressBar" style="width: 10%"></div>
    </div>

    <div class="quiz-container">
        <div class="question-container" id="questionContainer">
            <div class="question" id="question">Chargement de la question...</div>
            <div class="options-container" id="optionsContainer">
                <!-- Les options seront ajoutées ici par JavaScript -->
            </div>
            <button class="next-btn" id="nextBtn" disabled>Suivant</button>
        </div>

        <div class="result-container" id="resultContainer">
            <h2>Quiz terminé !</h2>
            <p>Votre score final est: <span id="finalScore">0</span>/10</p>
            <div class="action-buttons">
                <button class="btn btn-primary" id="shareBtn">Partager le score</button>
                <button class="btn btn-secondary" id="restartBtn">Relancer une autre partie</button>
            </div>
        </div>
    </div>

    <script src="quiz.js"></script>
</body>
</html>
